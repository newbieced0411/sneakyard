name: sneakyard

x-app: &app
  build:
    context: .
    target: app
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-sneakyard-local-key}
      VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_PORT:-8081}
      VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
  restart: unless-stopped
  environment: &app-environment
    APP_NAME: Sneakyard
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_KEY: ${APP_KEY:-base64:QLdVkvcpuHkwO9X3mT6vAC7iaxb3Bp6UgoP3tgB1/TU=}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-sneakyard}
    DB_USERNAME: ${DB_USERNAME:-sneakyard}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-sneakyard}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-sneakyard-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-sneakyard-local-secret}
    REVERB_HOST: ${REVERB_INTERNAL_HOST:-reverb}
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost:8080}
    FILESYSTEM_DISK: public
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-orders@sneakyard.ph}
    MAIL_FROM_NAME: Sneakyard
    ORDER_EMAIL_NOTIFICATIONS: ${ORDER_EMAIL_NOTIFICATIONS:-false}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sneakyard.ph}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
    META_CATALOG_ID: ${META_CATALOG_ID:-}
    META_PAGE_ID: ${META_PAGE_ID:-}
    META_PIXEL_ID: ${META_PIXEL_ID:-}
    META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
    FACEBOOK_PAGE_URL: ${FACEBOOK_PAGE_URL:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - sneakyard-storage:/var/www/html/storage

services:
  app:
    <<: *app

  web:
    build:
      context: .
      target: web
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-sneakyard-local-key}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - sneakyard-storage:/var/www/html/storage:ro

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,notifications,integrations", "--sleep=1", "--tries=3", "--timeout=120"]
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:default,redis:notifications,redis:integrations", "--max=500"]
      interval: 60s
      timeout: 10s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8081}:8080"

  postgres:
    image: postgres:18.0-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sneakyard}
      POSTGRES_USER: ${DB_USERNAME:-sneakyard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - sneakyard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sneakyard} -d ${DB_DATABASE:-sneakyard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.1-alpine3.22
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sneakyard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  sneakyard-postgres:
  sneakyard-redis:
  sneakyard-storage:
